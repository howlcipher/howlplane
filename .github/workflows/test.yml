name: Run Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'documentation/**'
      - 'docs/**'
  pull_request:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-python:
    name: Fast Python (${{ matrix.python-version }})
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_go_build.py is `integration`, not `slow`, so it runs here and
      # shells out to `go build` and `gofmt`. Pin the toolchain rather than
      # judging gofmt drift by whatever the runner image happens to ship.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all,dev]
      - name: Install SlopsLint
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/install_slopslint.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Run fast deterministic suite
        run: make test-fast

  full-python:
    name: Full Python regression (3.12)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all,dev]
      # tests/test_hygiene_policy.py::test_provider_integrity_verification
      # verifies the pinned binary on the live system and fails closed when it is
      # absent. The fast job deselects it as `slow`, so this gate is the one that
      # needs the real executable.
      - name: Install SlopsLint
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/install_slopslint.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      # `shell: bash` is load-bearing: it runs the step under `bash -eo pipefail`.
      # GitHub's default shell is `bash -e {0}`, which does NOT set pipefail, so
      # piping pytest into `tee` would hand the step tee's exit status and this
      # gate could never fail.
      - name: Run full regression, branch coverage, and timing report
        shell: bash
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --cov=src --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=42 --durations=25 | tee pytest-full.log
      # The timing report is most worth reading on the runs that failed.
      - name: Publish timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-timings-py312
          path: pytest-full.log

  nightly-python:
    name: Nightly full Python (${{ matrix.python-version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[all,dev]
      - name: Install SlopsLint
        run: |
          mkdir -p "$HOME/.local/bin"
          bash scripts/install_slopslint.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      # `live` tests are deselected by tests/conftest.py unless
      # HOWLPLANE_LIVE_PROVIDERS is set, so this step cannot reach a real
      # provider even though it names no marker expression.
      - name: Run full, slow, and acceptance coverage
        run: PYTHONPATH=. python -m pytest tests/ -v --durations=25
      # Installs howldream ONLY here, pinned to an exact commit -- never as a
      # pyproject.toml dependency. HowlPlane's native provider (see
      # src/control_plane/howldream_runner.py) treats howldream as an optional
      # runtime it degrades gracefully without; it must not become a hard
      # package dependency just to prove the real import path still works.
      # Bump the pin deliberately (a visible diff), not to a moving @main, so
      # a passing run here always means the same howldream code was tested.
      - name: Install pinned howldream (live tests only)
        if: ${{ vars.HOWLPLANE_RUN_LIVE_TESTS == 'true' }}
        run: pip install "git+https://github.com/howlcipher/howldream.git@bd10b18b7182e5216b494d728d015dbbba9b32d0"
      # tests/test_howldream_live_integration.py exercises
      # NativeHowlDreamProvider against this real, pinned howldream install --
      # not DeterministicTestExplorationProvider -- closing the gap where
      # every other HowlDream test here substitutes the fake provider before
      # reaching the real import boundary.
      # Exit code 5 is "no tests collected" -- kept as a defensive fallback so
      # a gate that later loses its only live test doesn't fail on that alone;
      # it does not mask an actual test failure (nonzero, non-5 exit codes
      # still fail this step).
      - name: Run live tests only when explicitly enabled
        if: ${{ vars.HOWLPLANE_RUN_LIVE_TESTS == 'true' }}
        shell: bash
        env:
          HOWLPLANE_LIVE_PROVIDERS: '1'
        run: |
          PYTHONPATH=. python -m pytest tests/ -v -m live || [ $? -eq 5 ]

  # The `main-protection` ruleset requires the status check context
  # `test-python`. A required check that never reports is not a skipped check --
  # it is a permanently BLOCKED pull request (see the same note in hygiene.yml,
  # observed on PR #62). This job carries that context forward over the split
  # fast/full matrix. `always()` makes it report failure instead of being
  # skipped when a dependency fails; the event guard keeps it skipped on the
  # nightly schedule, matching its dependencies.
  test-python:
    name: test-python
    if: always() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    needs: [fast-python, full-python]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any Python gate failed
        run: |
          echo "fast-python: ${{ needs.fast-python.result }}"
          echo "full-python: ${{ needs.full-python.result }}"
          [ "${{ needs.fast-python.result }}" = "success" ] || exit 1
          [ "${{ needs.full-python.result }}" = "success" ] || exit 1

  # The `main-protection` ruleset requires the status check context `test-go`.
  # Do not rename or remove this job without updating branch protection rules.
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go mod tidy
      - name: Run Go tests with Coverage
        run: make coverage-go
