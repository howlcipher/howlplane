name: Repository Hygiene and Slop Gate

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.slop/**'
      - '.github/workflows/hygiene.yml'
  # Deliberately unfiltered, matching test.yml. The `main-protection` ruleset
  # requires the `SlopsLint Duplication & Ceiling Ratchet` context, and a
  # required check that never reports is not a skipped check -- it is a
  # permanently BLOCKED pull request. A path filter here made every
  # docs/issues-only PR unmergeable (observed on PR #62, which touched only
  # issues.md and sat at BLOCKED with 5/5 present checks green). The gate
  # itself is repository-wide, so filtering it only ever saved wall-clock.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: SlopsLint Duplication & Ceiling Ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pinned SlopsLint
        env:
          SLOPSLINT_VERSION: "0.1.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ -f "scripts/install_slopslint.sh" ]; then
            bash scripts/install_slopslint.sh
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Pinned SlopsLint Provenance
        run: |
          if ! command -v slopslint >/dev/null 2>&1; then
            echo "::error::SlopsLint binary missing from PATH"
            exit 1
          fi
          SLOP_VER=$(slopslint --version | awk '{print $2}')
          if [ "$SLOP_VER" != "0.1.0" ]; then
            echo "::error::SlopsLint version mismatch: got '$SLOP_VER', expected '0.1.0'"
            exit 1
          fi
          echo "Verified slopslint version: $SLOP_VER"

      - name: Execute Hygiene Gate (Classify & Enforce)
        run: |
          mkdir -p .slop/tombstones
          slopslint check --classify --enforce

      - name: Enforce Ceiling Ratchet against Base Branch
        if: github.event_name == 'pull_request'
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          echo "Resolving base branch: origin/${BASE_BRANCH}"
          git fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" || true
          slopslint ratchet "origin/${BASE_BRANCH}"
