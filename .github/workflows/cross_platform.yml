name: Cross-Platform Install Test

on:
  push:
    branches: [ "main" ]
    paths:
      - "cmd/howlplane/**"
      - "**.go"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Build HowlPlane CLI
        run: go build -o howlplane ./cmd/howlplane
