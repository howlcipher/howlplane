name: Release Control Plane

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build and verify wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Generate checksums
        run: |
          cd dist
          # Deliberately not "SHA256SUMS" -- release_installer.yml's
          # GoReleaser run publishes a file with that exact name, covering
          # the Go binaries, onto the same tag's release. Howl's manifest
          # models "howlplane" (Go) and "howlplane-engine" (this wheel) as
          # two separate components, each with its own checksum_file, so
          # they only need to not collide with each other.
          sha256sum *.whl > howlplane-engine-SHA256SUMS

      # This is the same install path Howl's installer uses (a fresh,
      # isolated venv + non-editable `pip install <wheel>`), not merely
      # proof the archive was created -- it proves the built wheel is a
      # working "howlplane" console script, catching the class of defect
      # where setuptools' auto-discovery silently drops the "src" package
      # every import and console_scripts entry in this codebase depends on.
      - name: Install wheel into an isolated environment and verify
        run: |
          python -m venv /tmp/verify-venv
          /tmp/verify-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/verify-venv/bin/howlplane --version
          /tmp/verify-venv/bin/python -c "import src.control_plane"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-wheel
          path: |
            dist/*.whl
            dist/howlplane-engine-SHA256SUMS

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: control-plane-wheel
          path: dist

      - name: Attach wheel and checksums to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          REPO=${{ github.repository }}

          # This tag's release may already exist (release_installer.yml's
          # goreleaser run publishes the Go binaries under the same tag,
          # and workflow ordering between the two is not guaranteed) --
          # create it only if missing, then upload/replace these assets.
          if ! gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$REPO" --title "HowlPlane $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/*.whl dist/howlplane-engine-SHA256SUMS --repo "$REPO" --clobber
