experiment_plan:
  trajectory_target: 6
  bounds: exactly three experiments and one sample per arm
  experiments:
    EXP-60B-CONTEXT-001:
      status: PREREGISTERED
      experiment_type: CONTEXT
      task_class: architecture_analysis
      baseline: context.task_plus_acceptance/v1
      candidate: context.relevant_documentation/v1
      baseline_provider: local_ollama
      candidate_provider: local_ollama
      hypothesis: >-
        Bounded relevant source context improves exact extraction of the
        trajectory discovery protocol compared with task and acceptance only.
      expected_outcome: >-
        Candidate passes the exact fact verifier while baseline does not.
      falsification_criteria:
        - candidate.verification_pass_rate < baseline.verification_pass_rate
      metrics:
        - verification_pass_rate
        - mean_latency
      deterministic_verifier: >-
        Exact normalized lines for MIN_PATTERN_OCCURRENCES and all four
        PATTERN_MINERS function names in source order.
      repair_policy: no repair, preserving the context dimension
      prediction_digest: c10d649f967190849ffc9cb4788bef97670202a1f5269cc57e490a257897b628
      next_action: run_baseline
    EXP-60B-ROUTING-001:
      status: PREREGISTERED
      experiment_type: ROUTING
      task_class: failure_classification
      baseline: routing.local_first_low_risk/v1
      candidate: routing.frontier_first/v1
      baseline_provider: local_ollama
      candidate_provider: claude_code
      hypothesis: >-
        Frontier first routing produces a verifiable first pass classification
        more often than local first routing for the historical agy exhaustion.
      expected_outcome: >-
        Candidate has a higher first pass verification rate than baseline.
      falsification_criteria:
        - candidate.first_pass_success_rate < baseline.first_pass_success_rate
      metrics:
        - first_pass_success_rate
        - mean_repair_cycles
        - mean_latency
        - provider_failures
      deterministic_verifier: >-
        Exact normalized availability status, failure type, and quality evidence
        classification derived from the preserved #59 fixture.
      repair_policy: >-
        At most one bounded remediation after a failed first pass. Local first
        may use its registered Claude escalation target. All attempts and the
        exact repair count remain visible.
      prediction_digest: ec4e4bb71cd515479f624cb6a0d577e37d4de830f12ada8ebe5c7d0ea8c58190
      next_action: run_baseline
    EXP-60B-REVIEW-001:
      status: PREREGISTERED
      experiment_type: REVIEW_TOPOLOGY
      task_class: review
      baseline: review.general_single/v1
      candidate: review.correctness_regression/v1
      baseline_provider: local_ollama
      candidate_provider: local_ollama
      hypothesis: >-
        Split correctness and regression review detects the known historical
        canary identifier mismatch at least as reliably as one general reviewer.
      expected_outcome: >-
        Candidate verification is no worse than baseline and preserves all
        completed review results and disagreement.
      falsification_criteria:
        - candidate.verification_pass_rate < baseline.verification_pass_rate
      metrics:
        - verification_pass_rate
        - mean_latency
        - provider_failures
      deterministic_verifier: >-
        Review output must parse through the production review parser. A known
        defect is confirmed only when a finding identifies the dehyphenated
        canary identifier mismatch in the historical artifact.
      repair_policy: no format repair or provider fallback, preserving topology
      prediction_digest: 281103cc29f0588b11ec870787183f0c5b523c54f708fd848e19bc2dc1ddd39b
      next_action: run_baseline
  bounded_out:
    task_decomposition:
      status: SKIPPED
      reason: >-
        No nontrivial low risk fixture currently requires meaningful planning.
        Adding elaborate planning to a trivial task would manufacture evidence.

