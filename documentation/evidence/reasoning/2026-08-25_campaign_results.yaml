apparent_patterns:
  bounded_source_context_helped_one_exact_fact_task:
    evidence: >-
      Candidate passed and baseline failed EXP-60B-CONTEXT-002 with the same
      local provider and exact verifier.
    sample_size: one trajectory per arm in task class other
    competing_explanations:
      - the candidate was directly supplied the answer-bearing source excerpt
      - one stochastic local generation per arm
      - no reproduction on another fact task or provider
    confidence: WEAKLY_SUPPORTED
    actionable: false
    reason: requires comparable repetitions across tasks and providers
  frontier_first_did_not_improve_exact_failure_classification:
    evidence: >-
      Both routing arms and both one-cycle remediations failed exact
      verification; no provider availability failure occurred.
    sample_size: one trajectory per arm in task class bug_fix
    competing_explanations:
      - exact enum wording dominated general semantic correctness
      - Claude model identity was not observable
      - one historical failure fixture cannot characterize a provider family
    confidence: INCONCLUSIVE
    actionable: false
    reason: no winning strategy and no replicated provider comparison
  single_reviewer_outperformed_split_topology_on_one_fixture:
    evidence: >-
      Baseline found the known delimiter defect; both candidate reviewers
      missed it, and the candidate falsification criterion triggered.
    sample_size: one historical fixture with one baseline and two candidate reviews
    competing_explanations:
      - stochastic generations from the same local model
      - role prompt calibration may matter more than reviewer count
      - candidate reviewers focused on lifecycle language instead of traceability
    confidence: FALSIFIED_FOR_THIS_FIXTURE_ONLY
    actionable: false
    reason: no universal topology default follows from one fixture
  repeated_low_risk_local_success:
    evidence: >-
      Discovery fingerprint 7d18349014334fbe links two successful local
      trajectories in different task classes.
    sample_size: two successes selected from eight current live trajectories
    competing_explanations:
      - task selection favored bounded low-risk local work
      - six other current live trajectories failed verification
      - no comparable frontier arms exist for both successful tasks
    confidence: REQUIRES_MORE_EVIDENCE
    actionable: false
    reason: observation remains open and unadopted

decision_gate:
  decision: COLLECT_MORE_TRAJECTORY_EVIDENCE
  rationale: >-
    The campaign materially broadened evidence but does not yet provide enough
    diversity and comparability for a learned strategy system. Each strategy
    comparison has one sample per arm, only one primary Claude trajectory was
    observed, no repair succeeded, and review topology used one historical
    fixture.
  dimensions_too_sparse:
    - repeated comparable tasks within each task class
    - more than one primary cloud-provider trajectory and observable model IDs
    - successful repair or remediation outcomes
    - additional review fixtures and reviewer role combinations
    - independent context comparison reproductions
    - provider composition experiments
    - meaningful task decomposition experiments
    - observed costs where a provider exposes them

