[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "howlplane"
version = "0.1.0"
description = "HowlPlane — An AI Engineering Control Plane for governed, multi-agent software engineering."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "requests>=2.33.1",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "flake8",
    "black",
    "bandit",
    "pdoc",
    "jsonschema",
]

[project.scripts]
ai = "howlplane.control_plane.cli:legacy_main"
howlplane = "howlplane.control_plane.cli:main"

# Canonical package is rooted at howlplane (HOWL-CANON-004).
# Installs into site-packages as howlplane and howlplane.control_plane.
[tool.setuptools.packages.find]
where = ["src"]
include = ["howlplane", "howlplane.*"]

[tool.setuptools.package-data]
"howlplane.control_plane.reasoning" = ["builtin_strategies.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated behavioral coverage with no real external boundary",
    "integration: multiple HowlPlane components with external boundaries faked",
    "acceptance: end-to-end in-process capability or governed-flow coverage",
    "slow: measured as unsuitable for the rapid inner development loop",
    "live: intentionally contacts a real external provider or service; explicitly gated",
]
