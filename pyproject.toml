[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "howlplane"
version = "0.1.0"
description = "HowlPlane — An AI Engineering Control Plane for governed, multi-agent software engineering."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "requests>=2.33.1",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "langchain-text-splitters>=1.1.2",
]
ui = [
    "textual>=8.2.8",
    "streamlit>=1.59.0",
]
server = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "mcp>=1.28.1,<3.0.0",
]
cloud = [
    "boto3>=1.43.52",
]
research = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.3",
]
agent-frameworks = [
    "litellm>=1.83.7",
    "langgraph>=1.2.8",
    "langchain-core>=1.5.3",
    "langsmith>=0.10.0",
]
google = [
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.10.0",
]
postgres = [
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0",
]
queue = [
    "celery>=5.6.3",
    "redis>=8.0.1",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "flake8",
    "black",
    "bandit",
    "pdoc",
    "jsonschema",
]
all = [
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "langchain-text-splitters>=1.1.2",
    "textual>=8.2.8",
    "streamlit>=1.59.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "mcp>=1.28.1,<3.0.0",
    "boto3>=1.43.52",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.3",
    "litellm>=1.83.7",
    "langgraph>=1.2.8",
    "langchain-core>=1.5.3",
    "langsmith>=0.10.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.10.0",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0",
    "celery>=5.6.3",
    "redis>=8.0.1",
]

[project.scripts]
ai = "src.control_plane.launcher:legacy_main"
howlplane = "src.control_plane.launcher:main"

[tool.setuptools.package-data]
"src.control_plane.reasoning" = ["builtin_strategies.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
