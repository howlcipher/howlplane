schema_version: 1
artifact: incident-sift-operational-proof
description: Independent source scan and documentation inspection only; functional acceptance is outside this contract.
profiles: [secrets.scan, docs.claims]
acceptance:
  - id: SOURCE-SCAN
    requirement: checks_pass
    checks: [secrets.scan]
  - id: HIGH-FINDINGS
    requirement: max_findings
    min_severity: HIGH
    limit: 0
docs:
  claim_sources: [README.md]
