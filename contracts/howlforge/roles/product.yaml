# EXAMPLE role definition.
schema_version: howlforge.role/v1
id: product
description: Defines scope, requirements and acceptance criteria.
responsibilities:
  - define_scope
  - write_requirements
  - set_acceptance_criteria
  - prioritize
required_capabilities:
  reasoning: high
  planning: high
  documentation: high
  research: medium
preferred_runtimes:
  - provider: anthropic
    model: opus
fallback_runtimes:
  - provider: google
    model: gemini-pro
  - provider: openai
    model: gpt-5.6-sol
handoff_required: true
verification_required: false
