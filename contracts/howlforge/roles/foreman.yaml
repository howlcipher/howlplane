# EXAMPLE role definition. Runtime preferences are this operator's initial
# HowlFutureWorks choices, not universal statements about model quality.
schema_version: howlforge.role/v1
id: foreman
description: Coordinates complex work and delegates to specialist workers.
responsibilities:
  - decompose_work
  - delegate
  - inspect_results
  - recover_failures
  - synthesize_outputs
  - request_verification
required_capabilities:
  reasoning: very_high
  tool_use: very_high
  long_horizon: very_high
  coding: medium
  context_window: high
preferred_runtimes:
  - provider: openai
    model: gpt-5.6-sol
fallback_runtimes:
  - provider: anthropic
    model: opus
  - provider: google
    model: gemini-flash
handoff_required: true
verification_required: true
verification:
  required: true
  verifier_role: reviewer
  independent_runtime: preferred
