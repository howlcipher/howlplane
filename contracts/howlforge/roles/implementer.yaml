# EXAMPLE role definition.
schema_version: howlforge.role/v1
id: implementer
description: Writes and modifies code against a defined specification.
responsibilities:
  - implement_specification
  - write_tests
  - run_tests
  - record_changes
  - produce_handoff
required_capabilities:
  coding: very_high
  tool_use: high
  testing: high
  reasoning: high
preferred_runtimes:
  - provider: cursor
    model: composer
fallback_runtimes:
  - provider: google
    model: gemini-flash
  - provider: openai
    model: gpt-5.6-sol
handoff_required: true
verification_required: true
verification:
  required: true
  # An implementer must never be the final verifier of its own work.
  verifier_role: reviewer
  independent_runtime: required
