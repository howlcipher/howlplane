# EXAMPLE role definition.
schema_version: howlforge.role/v1
id: devops
description: Builds and maintains build, packaging and deployment paths.
responsibilities:
  - define_pipelines
  - manage_configuration
  - automate_builds
  - verify_deployments
required_capabilities:
  tool_use: high
  coding: high
  reasoning: high
  testing: medium
preferred_runtimes:
  - provider: openai
    model: gpt-5.6-sol
fallback_runtimes:
  - provider: anthropic
    model: opus
  - provider: google
    model: gemini-flash
handoff_required: true
verification_required: true
verification:
  required: true
  verifier_role: reviewer
  independent_runtime: preferred
