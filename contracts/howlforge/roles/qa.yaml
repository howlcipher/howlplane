# EXAMPLE role definition.
schema_version: howlforge.role/v1
id: qa
description: Exercises behavior to find defects the implementer did not.
responsibilities:
  - design_test_cases
  - exercise_edge_cases
  - reproduce_failures
  - report_defects
required_capabilities:
  testing: high
  reasoning: high
  tool_use: high
  coding: high
preferred_runtimes:
  - provider: google
    model: gemini-flash
fallback_runtimes:
  - provider: cursor
    model: composer
  - provider: openai
    model: gpt-5.6-sol
handoff_required: true
verification_required: false
