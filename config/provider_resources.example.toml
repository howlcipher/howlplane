# Copy the relevant sections into ~/.config/howlplane/config.toml or point
# HOWLPLANE_LOCAL_CONFIG at a private TOML file. This example grants no secrets.

[ai_resources]
operating_mode = "connected"

[ai_resources.providers.claude_code]
enabled = true
# Optional headless tool execution profile overrides:
# [ai_resources.providers.claude_code.execution_profile]
# extra_allowed_bash = ["pytest -q:*"]
# disallowed_tools = []
# permission_mode = "acceptEdits" # "acceptEdits" | "plan" | "manual" | "dontAsk" (bypassPermissions is forbidden)

[ai_resources.providers.codex]
enabled = true

[ai_resources.providers.local_ollama]
enabled = true
# model_id may be set only when the registered adapter declares it configurable.
# model_id = "qwen2.5-coder:7b-instruct"

[ai_resources.providers.devin_cli]
enabled = false

# Cursor Agent CLI (executable `agent`). Under the default `prepare` trust policy
# each workspace is trusted first with `howlplane factory prepare --repo <repo>`;
# under `bypass` (below) no preparation is needed.
[ai_resources.providers.cursor]
enabled = false

# Workspace trust policy for unattended agents (top-level table, not under
# ai_resources): "strict", "prepare" (built-in default), or "bypass". Bypass
# uses only audited vendor flags (Cursor --trust, Devin --respect-workspace-trust
# false) and never bypasses HowlPlane governance. See documentation/WORKSPACE_TRUST.md.
[workspace_trust]
policy = "bypass"

[ai_resources.provider_policy]
strategy = "adaptive_capacity"
subscription_first = true
prefer_existing_capacity = true
external_before_local = true
allow_paid_api = false
preserve_independent_review = true
preferred_external = []
preferred_local = []
cooldown_seconds = 300

# Local-only variant:
# [ai_resources]
# operating_mode = "local_only"
#
# [ai_resources.providers.local_ollama]
# enabled = true
#
# [ai_resources.provider_policy]
# allow_paid_api = false

# Optional System 1 judgment from HowlInstinct (off by default). HowlInstinct
# only ranks resources that Plane already approved; Plane owns every threshold.
# mode: "off" (default), "shadow" (record the judgment, keep deterministic choice),
# or "active" (an accepted judgment may reorder candidates that already tie on
# economics and capacity). minimum_instinct_margin has no default on purpose.
# [ai_resources.semantic_recommendation]
# mode = "shadow"
# command = "howlinstinct"
# minimum_instinct_margin = 0.35
# timeout_seconds = 5
# decision_roles = ["implementation", "remediation"]
# strict = false              # true blocks routing on an untrusted semantic result
# allow_in_local_only = false # HowlInstinct may use a remote provider, so off in local_only
